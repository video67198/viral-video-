<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium Video</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#05070f;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:15px;
}

.box{
width:380px;
background:#0d111c;
border:2px solid #00ffd5;
border-radius:20px;
padding:20px;
color:#fff;
text-align:center;
}

h1{
font-size:32px;
margin-bottom:20px;
}

.info{
font-size:22px;
color:#cfcfcf;
line-height:1.7;
}

.info span{
color:#00ffd5;
font-weight:bold;
}

.yellow{
color:#ffc400;
}

.adbox{
margin:25px 0;
padding:18px;
border:2px solid #444;
border-radius:15px;
font-size:28px;
font-weight:bold;
}

.counter{
display:flex;
justify-content:space-between;
background:#090c14;
padding:20px;
border-radius:15px;
margin-bottom:25px;
}

.counter h3{
color:#999;
font-size:20px;
margin-bottom:10px;
}

.counter p{
font-size:45px;
font-weight:bold;
}

.green{
color:#00ffd5;
}

.btn{
width:100%;
padding:18px;
border:none;
border-radius:15px;
font-size:28px;
font-weight:bold;
color:#fff;
cursor:pointer;
background:linear-gradient(90deg,#00ffd5,#ff2d75);
}
</style>

</head>
<body>

<div class="box">

<h1>প্রিমিয়াম ভিডিওটি লক করা আছে!</h1>

<div class="info">
ভিডিওটি দেখতে আপনাকে <span>১ টি</span> অ্যাড দেখতে হবে।<br>
প্রতিটি অ্যাড <span class="yellow">৬০ সেকেন্ড</span> দেখতে হবে।
</div>

<div class="adbox">
📺 ১ টি অ্যাড
</div>

<div class="counter">

<div>
<h3>মোট অ্যাড</h3>
<p>১</p>
</div>

<div>
<h3>দেখা হয়েছে</h3>
<p class="green" id="count">০</p>
</div>

</div>

<button id="actionBtn" class="btn">
আড দেখুন (০/১)
</button>

</div>

<script>

const adLink="https://www.effectivecpmnetwork.com/rxpxf1ikn?key=14d3589a10b3e9d095c578a9e5a2d70e";

const videoLink="https://t.me/+6WMf5P3PMaowZjk1";

let adSeen=localStorage.getItem("adSeen");

const btn=document.getElementById("actionBtn");
const count=document.getElementById("count");

if(adSeen==="true"){
btn.innerHTML="এখন ভিডিও দেখুন";
count.innerHTML="১";
}

btn.onclick=function(){

if(localStorage.getItem("adSeen")==="true"){

window.location.href=videoLink;

}else{

localStorage.setItem("adSeen","true");

window.open(adLink,"_blank");

}

};

window.addEventListener("focus",function(){

if(localStorage.getItem("adSeen")==="true"){

btn.innerHTML="এখন ভিডিও দেখুন";

count.innerHTML="১";

}

});

</script>

</body>
</html>
