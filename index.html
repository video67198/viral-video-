<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PomPom Tube - Premium Streaming</title>
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 29, 47, 0.7);
      --accent-color: #ff0055;
      --accent-hover: #ff2a75;
      --neon-cyan: #00f3ff;
      --text-main: #ffffff;
      --text-sub: #a0aec0;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Background Ambilight Dynamic Effect */
    #ambilight-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      filter: blur(80px);
      opacity: 0.5;
      pointer-events: none;
    }

    /* Header Navigation */
    header {
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-color);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 16px;
      width: 40%;
      max-width: 500px;
      transition: 0.3s;
    }

    .search-bar:focus-within {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: white;
      width: 100%;
      padding-right: 10px;
    }

    .search-bar button {
      background: transparent;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
    }

    /* Layout Wrapper */
    .container {
      max-width: 1280px;
      margin: 20px auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
    }

    @media (max-width: 992px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* Video Player Box with Concentric RGB Border Effect */
    .player-wrapper {
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      padding: 3px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .player-wrapper::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, var(--accent-color), var(--neon-cyan), transparent 30%);
      animation: rotate 6s linear infinite;
      z-index: 0;
    }

    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    .player-inner {
      position: relative;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      z-index: 1;
    }

    video {
      width: 100%;
      display: block;
      aspect-ratio: 16 / 9;
      outline: none;
    }

    /* Action Control Bar */
    .video-info {
      margin-top: 15px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .video-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      border-top: 1px solid var(--border-color);
      padding-top: 15px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }

    .btn:hover {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }

    .btn-download {
      background: linear-gradient(45deg, var(--accent-color), #ff5500);
      font-weight: 600;
    }

    /* Modal Pop-up (Ad Verification Gateway) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .modal-card {
      background: #131927;
      border: 1px solid var(--neon-cyan);
      border-radius: 16px;
      padding: 30px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
    }

    .modal-card h3 {
      color: var(--neon-cyan);
      margin-bottom: 10px;
    }

    .modal-card p {
      color: var(--text-sub);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .ad-link-btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 15px;
      transition: 0.3s;
    }

    .ad-link-btn:hover {
      background: var(--accent-hover);
    }

    .close-modal {
      background: transparent;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Background Ambilight Dynamic Canvas -->
  <canvas id="ambilight-canvas"></canvas>

  <!-- Header Section -->
  <header>
    <div class="logo-container">
      <i class="fa-solid fa-bars" style="cursor:pointer;"></i>
      <a href="#" class="logo"><i class="fa-solid fa-play-circle"></i> PomPom Tube</a>
    </div>
    <div class="search-bar">
      <input type="text" placeholder="ভিডিও খুঁজুন...">
      <button><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container">
    <!-- Main Content Video Player -->
    <main>
      <div class="player-wrapper">
        <div class="player-inner">
          <video id="main-player" controls poster="https://via.placeholder.com/1280x720/161d2f/ffffff?text=PomPom+Tube+Video">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            আপনার ব্রাউজারটি ভিডিও প্লেয়ার সাপোর্ট করে না।
          </video>
        </div>
      </div>

      <div class="video-info">
        <h1 class="video-title">অ্যানিমেটেড নিয়ন প্লেয়ার টেমপ্লেট - ভিডিও ডেমো</h1>
        <div class="action-bar">
          <div class="btn-group">
            <button class="btn"><i class="fa-regular fa-thumbs-up"></i> <span id="like-count">1.2K</span></button>
            <button class="btn"><i class="fa-solid fa-share"></i> শেয়ার</button>
          </div>
          <!-- ডাউনলোড বাটন যা পপ-আপ ট্রিগার করবে -->
          <button class="btn btn-download" id="open-download-modal"><i class="fa-solid fa-download"></i> ডাউনলোড করুন</button>
        </div>
      </div>
    </main>

    <!-- Sidebar Recommended Videos -->
    <aside>
      <div style="background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color);">
        <h3 style="font-size: 16px; margin-bottom: 10px;">পরবর্তী ভিডিওসমূহ</h3>
        <p style="color: var(--text-sub); font-size: 14px;">সাইডবার কনটেন্ট এখানে যুক্ত করুন...</p>
      </div>
    </aside>
  </div>

  <!-- Download Verification Ad Gateway Modal -->
  <div class="modal-overlay" id="download-modal">
    <div class="modal-card">
      <h3><i class="fa-solid fa-shield-halved"></i> ভেরিফিকেশন প্রয়োজন</h3>
      <p>ডাউনলোড লিঙ্কটি আনলক করতে নিচের স্পন্সর অফারটি সম্পন্ন করুন:</p>

      <!-- আপনার দেওয়া বিজ্ঞাপনের ডাইরেক্ট লিংক -->
      <a href="https://www.effectivecpmnetwork.com/rxpxf1ikn?key=14d3589a10b3e9d095c578a9e5a2d70e" target="_blank" class="ad-link-btn" id="ad-click-btn">
        <i class="fa-solid fa-external-link-alt"></i> স্পন্সর অফার দেখুন (Unlock Link)
      </a>

      <button class="close-modal" id="close-modal-btn">বন্ধ করুন</button>
    </div>
  </div>

  <!-- JavaScript Code -->
  <script>
    // Modal Interactivity
    const downloadBtn = document.getElementById('open-download-modal');
    const modal = document.getElementById('download-modal');
    const closeModal = document.getElementById('close-modal-btn');

    downloadBtn.addEventListener('click', () => {
      modal.style.display = 'flex';
    });

    closeModal.addEventListener('click', () => {
      modal.style.display = 'none';
    });

    // Simple Ambilight Effect Logic
    const video = document.getElementById('main-player');
    const canvas = document.getElementById('ambilight-canvas');
    const ctx = canvas.getContext('2d');

    function updateAmbilight() {
      if (!video.paused && !video.ended) {
        canvas.width = video.videoWidth / 10;
        canvas.height = video.videoHeight / 10;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }
      requestAnimationFrame(updateAmbilight);
    }

    video.addEventListener('play', () => {
      updateAmbilight();
    });
  </script>

  <!-- আপনার দেওয়া নেটওয়ার্ক বিজ্ঞাপনের স্ক্রিপ্ট -->
  <script src="https://pl26528999.effectivecpmnetwork.com/7d/4c/19/7d4c19a30d94a83e7e2a5331cab82f2c.js"></script>

</body>
</html>
