<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend VideoTube</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #2b1055;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* পপআপ কন্টেইনার */
        .popup-card {
            background: linear-gradient(to bottom, #ffe033, #ffd000);
            width: 340px;
            border-radius: 25px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            position: relative;
            border: 3px solid #fff;
        }

        /* নতুন নোটিশ টেক্সট স্টাইল */
        .top-notice {
            font-size: 15px;
            font-weight: bold;
            color: #000;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        /* ক্লোজ বাটন */
        .close-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #000;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #fff;
        }

        /* ব্যানার ইমেজ */
        .banner-img {
            width: 100%;
            border-radius: 15px;
            border: 2px solid #000;
            object-fit: cover;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            color: #000;
            margin: 15px 0 5px 0;
        }

        .counter-badge {
            background: #222;
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .instruction {
            color: #333;
            font-size: 13px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* বাটন স্টাইল */
        .action-btn {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 0px #000;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0px #000;
        }

        /* সফল বাটন (সবুজ) */
        .action-btn.success {
            background: #00875a;
            box-shadow: 0 5px 0px #005236;
        }
    </style>
</head>
<body>

    <div class="popup-card">
        <div class="close-btn">X</div>
        
        <!-- আপনার দেওয়া নতুন মোটা লেখাটি এখানে যুক্ত করা হয়েছে -->
        <div class="top-notice">
            টেলিগ্রাম সব নতুন পুরোনো ভিডিও দেয়া আছে ভিডিও দেখতে হলে আড ভিজিট করুন ২০ সেগেনট
        </div>
        
        <!-- ইমেজ ব্যানার -->
        <img src="https://i.postimg.cc/zBv7q2hL/1783954916395.jpg" alt="Banner" class="banner-img">
        
        <div class="title">নতুন লিংক ভাইরাল</div>
        
        <div class="counter-badge" id="view-count">Watched: 0 / 1</div>
        
        <div class="instruction" id="status-text">Watch the ad completely to unlock.</div>
        
        <!-- ডাইরেক্ট অ্যাড লিংক -->
        <a href="https://www.effectivecpmnetwork.com/rxpxf1ikn?key=14d3589a10b3e9d095c578a9e5a2d70e" target="_blank" class="action-btn" id="main-btn" onclick="startTimer()">
            ▶ Watch Ad
        </a>
    </div>

<script>
    let timeLeft = 20; 
    let timerStarted = false;

    function startTimer() {
        if (timerStarted) return; 
        timerStarted = true;
        
        const mainBtn = document.getElementById('main-btn');
        const statusText = document.getElementById('status-text');
        
        setTimeout(function() {
            mainBtn.removeAttribute('href'); 
            mainBtn.removeAttribute('target');
            mainBtn.style.pointerEvents = 'none'; 
        }, 500);
        
        const countdown = setInterval(function() {
            timeLeft--;
            mainBtn.innerText = `অপেক্ষা করুন (${timeLeft} সেকেন্ড)`;
            statusText.innerText = `আপনাকে ২০ সেকেন্ড বিজ্ঞাপনে থাকতে হবে।`;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                
                document.getElementById('view-count').innerText = "Watched: 1 / 1";
                statusText.innerText = "অভিনন্দন! আপনার ভিডিওটি আনলক হয়েছে।";
                
                mainBtn.innerText = "এখন ভিডিও দেখুন";
                mainBtn.classList.add('success');
                mainBtn.style.pointerEvents = 'auto'; 
                
                mainBtn.setAttribute('href', 'https://t.me/+6WMf5P3PMaowZjk1');
                mainBtn.setAttribute('target', '_blank');
            }
        }, 1000);
    }
</script>

</body>
</html>
