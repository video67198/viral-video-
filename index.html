<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Video</title>

<style>
body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#111827;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:90%;
    max-width:400px;
    background:#1f2937;
    padding:25px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,0,0,.4);
}

h2{
    font-size:22px;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    margin-top:15px;
}

#adBtn{
    background:#ff5722;
    color:#fff;
}

#videoBtn{
    background:#16a34a;
    color:#fff;
    display:none;
}

#status{
    margin-top:18px;
    font-size:18px;
    color:#ffd54f;
}
</style>

</head>
<body>

<div class="box">

<h2>ভিডিও দেখতে হলে আপনাকে ২০ সেকেন্ড Ad দেখতে হবে</h2>

<button id="adBtn" onclick="startAd()">
📺 Ad দেখুন
</button>

<p id="status"></p>

<button id="videoBtn" onclick="window.location.href='https://t.me/+6WMf5P3PMaowZjk1'">
▶️ এখন ভিডিও দেখুন
</button>

</div>

<script>

function startAd(){

window.open("https://www.effectivecpmnetwork.com/ap1x8f4v?key=58f3df2cd95ae596c5711b68f05f7111","_blank");

document.getElementById("adBtn").disabled=true;

let time=20;

document.getElementById("status").innerHTML="⏳ অপেক্ষা করুন: "+time+" সেকেন্ড";

let timer=setInterval(function(){

time--;

document.getElementById("status").innerHTML="⏳ অপেক্ষা করুন: "+time+" সেকেন্ড";

if(time<=0){

clearInterval(timer);

document.getElementById("status").innerHTML="✅ এখন ভিডিও দেখতে পারবেন";

document.getElementById("videoBtn").style.display="block";

}

},1000);

}

</script>

</body>
</html>
